<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智學雲｜師生教學互動與班級管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .tab-active { background-color: #eef2ff; color: #4f46e5; font-weight: 700; border-right: 4px solid #4f46e5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden">

  <!-- ==================== 登入 / 註冊驗證畫面 ==================== -->
  <div id="authScreen" class="fixed inset-0 bg-gradient-to-br from-slate-100 via-indigo-50/60 to-emerald-50/40 flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 max-w-md w-full overflow-hidden my-auto">
      <!-- 頂部 Logo 區 -->
      <div class="p-7 pb-5 text-center border-b border-slate-100">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
          <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 tracking-wide">智學雲 EduCloud</h1>
        <p class="text-xs text-slate-400 mt-1">高二忠班 師生教學互動與班級管理平台</p>
      </div>

      <!-- 登入 / 註冊 模式切換 -->
      <div class="px-7 pt-5">
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl">
          <button id="authTabLogin" onclick="switchAuthMode('login')" class="py-2 text-sm font-bold rounded-lg bg-white text-slate-800 shadow-xs transition cursor-pointer">
            帳號登入
          </button>
          <button id="authTabRegister" onclick="switchAuthMode('register')" class="py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-800 transition cursor-pointer">
            建立新帳戶
          </button>
        </div>

        <!-- 身分選擇（教師 / 學生） -->
        <div class="mt-4">
          <label class="text-xs font-bold text-slate-500 block mb-2">請選擇您的身分</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="roleCardTeacher" onclick="selectAuthRole('teacher')" class="p-3 rounded-xl border-2 border-indigo-600 bg-indigo-50/60 text-left transition cursor-pointer">
              <div class="flex items-center justify-between mb-1">
                <span class="text-lg">👨‍🏫</span>
                <span class="w-4 h-4 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px]">✓</span>
              </div>
              <div class="font-bold text-sm text-indigo-900">教師帳戶</div>
              <div class="text-[11px] text-indigo-600/80">管理點名、課表、公告</div>
            </button>

            <button type="button" id="roleCardStudent" onclick="selectAuthRole('student')" class="p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition cursor-pointer">
              <div class="flex items-center justify-between mb-1">
                <span class="text-lg">🎓</span>
                <span class="w-4 h-4 rounded-full border border-slate-300"></span>
              </div>
              <div class="font-bold text-sm text-slate-700">學生帳戶</div>
              <div class="text-[11px] text-slate-400">每日打卡、交作業、私訊</div>
            </button>
          </div>
        </div>
      </div>

      <!-- 登入表單 -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="p-7 pt-5 space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">帳號 / 學號（教師請輸入教師帳號）</label>
          <input id="loginUsername" type="text" required placeholder="例如：teacher 或 S01" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">密碼</label>
          <input id="loginPassword" type="password" required placeholder="請輸入密碼" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" id="loginSubmitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition text-sm cursor-pointer">
          以教師身分登入系統
        </button>

        <!-- 快速測試帳號提示 -->
        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3 text-xs text-slate-500 space-y-1.5">
          <div class="font-bold text-slate-700 flex items-center justify-between">
            <span>⚡ 預設測試帳號（點擊自動填入）：</span>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" onclick="quickFillLogin('teacher', 'teacher', '1234')" class="px-2.5 py-1 bg-indigo-100/80 text-indigo-700 rounded-md font-medium hover:bg-indigo-200/70 cursor-pointer">
              教師：teacher / 1234
            </button>
            <button type="button" onclick="quickFillLogin('student', 'S01', '1234')" class="px-2.5 py-1 bg-emerald-100/80 text-emerald-700 rounded-md font-medium hover:bg-emerald-200/70 cursor-pointer">
              學生(林子軒)：S01 / 1234
            </button>
          </div>
        </div>
      </form>

      <!-- 註冊表單 -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="p-7 pt-5 space-y-3.5 hidden">
        <div id="regStudentFields" class="grid grid-cols-2 gap-3 hidden">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">班級座號</label>
            <input id="regSeat" type="text" placeholder="例如：07" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">學號（作為登入帳號）</label>
            <input id="regStudentId" type="text" placeholder="例如：S07" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
          </div>
        </div>

        <div id="regTeacherAccountField">
          <label class="text-xs font-bold text-slate-600 block mb-1">教師登入帳號</label>
          <input id="regTeacherUsername" type="text" placeholder="請設定英文或數字帳號" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm">
        </div>

        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">真實姓名 / 稱謂</label>
          <input id="regName" type="text" required placeholder="例如：王大明 或 李老師" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm">
        </div>

        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">設定密碼</label>
          <input id="regPassword" type="password" required placeholder="請設定登入密碼" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm">
        </div>

        <div id="regInviteCodeField">
          <label class="text-xs font-bold text-slate-600 block mb-1">教師註冊驗證碼 <span class="text-slate-400 font-normal">(預設：8888)</span></label>
          <input id="regInviteCode" type="text" placeholder="防止學生誤註冊為教師" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm">
        </div>

        <button type="submit" id="regSubmitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition text-sm mt-2 cursor-pointer">
          建立教師帳戶並進入系統
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 主系統介面 (登入後顯示) ==================== -->
  <div id="mainApp" class="h-screen flex overflow-hidden hidden">
    <!-- 側邊導覽列 -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 z-20">
      <div>
        <!-- Brand -->
        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow-sm">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-800 tracking-wide text-lg leading-tight">智學雲 EduCloud</h1>
            <p class="text-xs text-slate-400">高二忠班 班級管理系統</p>
          </div>
        </div>

        <!-- 目前登入帳號資訊卡 -->
        <div class="p-4 bg-slate-50 border-b border-slate-200">
          <div class="flex items-center justify-between mb-1">
            <span id="sidebarRoleTag" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700">教師權限</span>
            <button onclick="logout()" class="text-xs text-rose-500 hover:text-rose-700 font-bold flex items-center gap-1 cursor-pointer">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i> 登出
            </button>
          </div>
          <div id="sidebarUserName" class="font-bold text-sm text-slate-800 mt-1.5">導師：陳老師</div>
          <div id="sidebarUserAccount" class="text-xs text-slate-400 font-mono">帳號：teacher</div>
        </div>

        <!-- 導覽選單 -->
        <nav class="py-3 space-y-1">
          <button onclick="switchTab('attendance')" id="nav-attendance" class="w-full flex items-center gap-3 px-5 py-3 text-sm text-slate-600 hover:bg-slate-50 transition tab-active cursor-pointer">
            <i data-lucide="user-check" class="w-4 h-4"></i>
            <span>每日點名與打卡</span>
          </button>
          <button onclick="switchTab('timetable')" id="nav-timetable" class="w-full flex items-center gap-3 px-5 py-3 text-sm text-slate-600 hover:bg-slate-50 transition cursor-pointer">
            <i data-lucide="calendar-days" class="w-4 h-4"></i>
            <span>班級課表系統</span>
          </button>
          <button onclick="switchTab('announcements')" id="nav-announcements" class="w-full flex items-center gap-3 px-5 py-3 text-sm text-slate-600 hover:bg-slate-50 transition cursor-pointer">
            <i data-lucide="megaphone" class="w-4 h-4"></i>
            <span>課程公告發布</span>
          </button>
          <button onclick="switchTab('homework')" id="nav-homework" class="w-full flex items-center gap-3 px-5 py-3 text-sm text-slate-600 hover:bg-slate-50 transition cursor-pointer">
            <i data-lucide="book-open-check" class="w-4 h-4"></i>
            <span>每日作業與繳交</span>
          </button>
          <button onclick="switchTab('messages')" id="nav-messages" class="w-full flex items-center justify-between px-5 py-3 text-sm text-slate-600 hover:bg-slate-50 transition cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="message-square-text" class="w-4 h-4"></i>
              <span>師生一對一私訊</span>
            </div>
            <span id="unreadBadge" class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
          </button>
        </nav>
      </div>

      <!-- 底部狀態 -->
      <div class="p-4 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
        <span id="currentDateDisplay"></span>
        <span class="flex items-center gap-1 text-emerald-600 font-medium"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>已連線</span>
      </div>
    </aside>

    <!-- 主內容區塊 -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- 頂部 Header -->
      <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
        <h2 id="pageTitle" class="text-xl font-bold text-slate-800">每日點名與打卡</h2>
        <div class="flex items-center gap-4">
          <div id="liveClock" class="text-sm font-mono bg-slate-100 px-3 py-1 rounded-md text-slate-600 font-medium"></div>
          <div id="userProfileBadge" class="flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-xs font-bold">
          </div>
        </div>
      </header>

      <!-- 動態內容容器 -->
      <div id="contentArea" class="flex-1 overflow-y-auto p-8">
      </div>
    </main>
  </div>

  <!-- 通用 Modal 彈窗 -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div id="modalContent" class="bg-white rounded-2xl shadow-xl max-w-lg w-full overflow-hidden">
    </div>
  </div>

<script>
// ==================== 1. 初始資料庫與帳戶狀態管理 ====================
const TODAY_STR = new Date().toISOString().split('T')[0];
const TEACHER_INVITE_CODE = '8888';

const DEFAULT_DATA = {
  // 教師帳戶列表
  teachers: [
    { username: 'teacher', password: '1234', name: '陳老師' }
  ],
  // 學生帳戶列表（同時作為點名與作業名冊）
  students: [
    { id: 'S01', password: '1234', seat: '01', name: '林子軒' },
    { id: 'S02', password: '1234', seat: '02', name: '陳思妤' },
    { id: 'S03', password: '1234', seat: '03', name: '張宇翔' },
    { id: 'S04', password: '1234', seat: '04', name: '黃品妍' },
    { id: 'S05', password: '1234', seat: '05', name: '王柏翰' },
    { id: 'S06', password: '1234', seat: '06', name: '吳佳穎' }
  ],
  attendance: {
    [TODAY_STR]: {
      'S01': { status: 'present', time: '08:05', note: '' },
      'S02': { status: 'present', time: '08:12', note: '' },
      'S03': { status: 'late', time: '08:42', note: '公車誤點' },
      'S04': { status: 'leave', time: '-', note: '事假（已核准）' }
    }
  },
  timetable: {
    '1-1': { subject: '國文', teacher: '陳老師', room: '教室201' },
    '1-2': { subject: '英文', teacher: '林老師', room: '教室201' },
    '1-3': { subject: '數學', teacher: '王老師', room: '教室201' },
    '1-4': { subject: '物理', teacher: '張老師', room: '物理實驗室' },
    '2-1': { subject: '數學', teacher: '王老師', room: '教室201' },
    '2-2': { subject: '歷史', teacher: '李老師', room: '教室201' },
    '2-3': { subject: '體育', teacher: '劉老師', room: '操場' },
    '3-1': { subject: '英文', teacher: '林老師', room: '教室201' },
    '3-2': { subject: '化學', teacher: '趙老師', room: '化學實驗室' },
    '4-1': { subject: '國文', teacher: '陳老師', room: '教室201' },
    '5-1': { subject: '班會', teacher: '陳老師', room: '教室201' }
  },
  announcements: [
    {
      id: 'A01',
      title: '下週三第一次段考範圍與座位表公告',
      category: '考試日程',
      content: '請各位同學注意，下週三、四舉行第一次期中考。國文考至第四課，請提前準備文言文注釋。',
      pinned: true,
      date: TODAY_STR,
      readBy: ['S01', 'S02']
    },
    {
      id: 'A02',
      title: '校外教學家長同意書繳交提醒',
      category: '重要通知',
      content: '請尚未繳交家長同意書的同學，於本週五放學前交給班長彙整。',
      pinned: false,
      date: TODAY_STR,
      readBy: ['S01']
    }
  ],
  homework: [
    {
      id: 'H01',
      subject: '國文',
      title: '〈赤壁賦〉課後學習單與心得 300 字',
      dueDate: TODAY_STR,
      description: '請簡述蘇軾在文中展現的人生曠達態度，可直接於線上填寫文字繳交。',
      submissions: {
        'S01': { content: '蘇軾透過水與月的變與不變，體悟到萬物各有其主，不必羨慕無窮的長江，轉而珍惜當下的清風明月。', time: '09:30', grade: '95', feedback: '觀點清晰，文筆流暢！' },
        'S02': { content: '從主客問答中可以看到作者自我開解的過程，非常具有哲理。', time: '10:15', grade: '', feedback: '' }
      }
    },
    {
      id: 'H02',
      subject: '數學',
      title: '習作 2-1 三角函數練習題 (第1~10題)',
      dueDate: '2026-11-25',
      description: '請完成習作後拍照上傳雲端連結，或填寫計算答案。',
      submissions: {}
    }
  ],
  messages: {
    'S03': [
      { sender: 'student', text: '老師早安，今天早上公車拋錨所以晚到十分鐘，不好意思！', time: '08:40', read: true },
      { sender: 'teacher', text: '好的，老師知道了，路上安全最重要，進教室先安靜入座。', time: '08:43', read: true }
    ],
    'S04': [
      { sender: 'student', text: '老師您好，我今天家裡有事需要請假一天，家長昨晚有傳簡訊了。', time: '07:50', read: false }
    ]
  }
};

let appData = JSON.parse(localStorage.getItem('eduCloudData_v2')) || DEFAULT_DATA;
let currentUser = JSON.parse(sessionStorage.getItem('eduCloudSession')) || null; // { role: 'teacher'|'student', id: '', name: '', seat?: '' }
let authMode = 'login'; // 'login' | 'register'
let authSelectedRole = 'teacher'; // 'teacher' | 'student'
let currentTab = 'attendance';
let selectedChatStudentId = appData.students[0]?.id || 'S01';

function saveData() {
  localStorage.setItem('eduCloudData_v2', JSON.stringify(appData));
  if (currentUser) updateUnreadBadge();
}

// ==================== 2. 登入與註冊邏輯 ====================
function init() {
  document.getElementById('currentDateDisplay').textContent = TODAY_STR;
  setInterval(() => {
    const now = new Date();
    const clockEl = document.getElementById('liveClock');
    if (clockEl) clockEl.textContent = now.toTimeString().split(' ')[0];
  }, 1000);

  if (currentUser) {
    enterMainApp();
  } else {
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    lucide.createIcons();
  }
}

function switchAuthMode(mode) {
  authMode = mode;
  const tabLogin = document.getElementById('authTabLogin');
  const tabReg = document.getElementById('authTabRegister');
  const loginForm = document.getElementById('loginForm');
  const regForm = document.getElementById('registerForm');

  if (mode === 'login') {
    tabLogin.className = 'py-2 text-sm font-bold rounded-lg bg-white text-slate-800 shadow-xs transition cursor-pointer';
    tabReg.className = 'py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-800 transition cursor-pointer';
    loginForm.classList.remove('hidden');
    regForm.classList.add('hidden');
  } else {
    tabReg.className = 'py-2 text-sm font-bold rounded-lg bg-white text-slate-800 shadow-xs transition cursor-pointer';
    tabLogin.className = 'py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-800 transition cursor-pointer';
    regForm.classList.remove('hidden');
    loginForm.classList.add('hidden');
  }
  updateAuthRoleUI();
}

function selectAuthRole(role) {
  authSelectedRole = role;
  updateAuthRoleUI();
}

function updateAuthRoleUI() {
  const cardT = document.getElementById('roleCardTeacher');
  const cardS = document.getElementById('roleCardStudent');
  const loginBtn = document.getElementById('loginSubmitBtn');
  const regBtn = document.getElementById('regSubmitBtn');

  // 註冊欄位切換
  const regStudentFields = document.getElementById('regStudentFields');
  const regTeacherAccountField = document.getElementById('regTeacherAccountField');
  const regInviteCodeField = document.getElementById('regInviteCodeField');

  if (authSelectedRole === 'teacher') {
    cardT.className = 'p-3 rounded-xl border-2 border-indigo-600 bg-indigo-50/60 text-left transition cursor-pointer';
    cardT.querySelector('span:last-child').className = 'w-4 h-4 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px]';
    cardT.querySelector('span:last-child').textContent = '✓';

    cardS.className = 'p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition cursor-pointer';
    cardS.querySelector('span:last-child').className = 'w-4 h-4 rounded-full border border-slate-300';
    cardS.querySelector('span:last-child').textContent = '';

    loginBtn.textContent = '以教師身分登入系統';
    loginBtn.className = 'w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition text-sm cursor-pointer';
    regBtn.textContent = '建立教師帳戶並進入系統';
    regBtn.className = 'w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition text-sm mt-2 cursor-pointer';

    regStudentFields.classList.add('hidden');
    regTeacherAccountField.classList.remove('hidden');
    regInviteCodeField.classList.remove('hidden');
  } else {
    cardS.className = 'p-3 rounded-xl border-2 border-emerald-600 bg-emerald-50/60 text-left transition cursor-pointer';
    cardS.querySelector('span:last-child').className = 'w-4 h-4 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px]';
    cardS.querySelector('span:last-child').textContent = '✓';

    cardT.className = 'p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-slate-300 text-left transition cursor-pointer';

function quickFillLogin(role, user, pass) {
  selectAuthRole(role);
  document.getElementById('loginUsername').value = user;
  document.getElementById('loginPassword').value = pass;
}

function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();

  if (authSelectedRole === 'teacher') {
    const teacher = appData.teachers.find(t => t.username === username && t.password === password);
    if (!teacher) return alert('教師帳號或密碼錯誤！請確認是否已建立教師帳戶。');
    currentUser = { role: 'teacher', id: teacher.username, name: teacher.name };
  } else {
    const student = appData.students.find(s => s.id.toLowerCase() === username.toLowerCase() && s.password === password);
    if (!student) return alert('學生學號或密碼錯誤！請確認是否已建立學生帳戶。');
    currentUser = { role: 'student', id: student.id, name: student.name, seat: student.seat };
  }

  sessionStorage.setItem('eduCloudSession', JSON.stringify(currentUser));
  enterMainApp();
}

function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const password = document.getElementById('regPassword').value.trim();

  if (authSelectedRole === 'teacher') {
    const username = document.getElementById('regTeacherUsername').value.trim();
    const inviteCode = document.getElementById('regInviteCode').value.trim();
    if (!username) return alert('請輸入教師登入帳號');
    if (inviteCode !== TEACHER_INVITE_CODE) return alert('教師註冊驗證碼錯誤！（預設驗證碼為 8888）');
    if (appData.teachers.some(t => t.username === username)) return alert('此教師帳號已被註冊！');

    appData.teachers.push({ username, password, name });
    saveData();
    currentUser = { role: 'teacher', id: username, name };
  } else {
    const seat = document.getElementById('regSeat').value.trim().padStart(2, '0');
    const studentId = document.getElementById('regStudentId').value.trim().toUpperCase();
    if (!seat || !studentId) return alert('請填寫完整座號與學號');
    if (appData.students.some(s => s.id.toUpperCase() === studentId)) return alert('此學號已被註冊，請直接登入！');

    appData.students.push({ id: studentId, password, seat, name });
    // 依座號排序名冊
    appData.students.sort((a, b) => a.seat.localeCompare(b.seat));
    saveData();
    currentUser = { role: 'student', id: studentId, name, seat };
  }

  sessionStorage.setItem('eduCloudSession', JSON.stringify(currentUser));
  alert(`帳戶建立成功！歡迎 ${name} 進入智學雲系統。`);
  enterMainApp();
}

function logout() {
  sessionStorage.removeItem('eduCloudSession');
  currentUser = null;
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('loginPassword').value = '';
  lucide.createIcons();
}

function enterMainApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');

  const roleTag = document.getElementById('sidebarRoleTag');
  const userNameEl = document.getElementById('sidebarUserName');
  const userAccEl = document.getElementById('sidebarUserAccount');
  const profileBadge = document.getElementById('userProfileBadge');

  if (currentUser.role === 'teacher') {
    roleTag.textContent = '教師管理權限';
    roleTag.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700';
    userNameEl.textContent = currentUser.name;
    userAccEl.textContent = `教師帳號：${currentUser.id}`;
    profileBadge.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4"></i><span>教師：${currentUser.name}</span>`;
    profileBadge.className = 'flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-xs font-bold';
  } else {
    roleTag.textContent = '學生個人帳戶';
    roleTag.className = 'text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700';
    userNameEl.textContent = `${currentUser.seat}號 ${currentUser.name}`;
    userAccEl.textContent = `學生學號：${currentUser.id}`;
    profileBadge.innerHTML = `<i data-lucide="user" class="w-4 h-4"></i><span>學生：${currentUser.seat}號 ${currentUser.name}</span>`;
    profileBadge.className = 'flex items-center gap-2 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-bold';

// ==================== 3. 導覽分頁控制 ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('tab-active'));
  document.getElementById(`nav-${tab}`).classList.add('tab-active');

  const titles = {
    attendance: '每日點名與打卡',
    timetable: '班級課表系統',
    announcements: '課程公告發布',
    homework: '每日作業與繳交',
    messages: '師生一對一私訊'
  };
  document.getElementById('pageTitle').textContent = titles[tab];
  renderCurrentTab();
}

function renderCurrentTab() {
  const container = document.getElementById('contentArea');
  if (currentTab === 'attendance') renderAttendance(container);
  else if (currentTab === 'timetable') renderTimetable(container);
  else if (currentTab === 'announcements') renderAnnouncements(container);
  else if (currentTab === 'homework') renderHomework(container);
  else if (currentTab === 'messages') renderMessages(container);
  lucide.createIcons();
}

// ==================== 4. 模組一：每日點名與打卡 ====================
function renderAttendance(container) {
  if (!appData.attendance[TODAY_STR]) appData.attendance[TODAY_STR] = {};
  const todayRecords = appData.attendance[TODAY_STR];

  if (currentUser.role === 'student') {
    const myRec = todayRecords[currentUser.id];
    container.innerHTML = `
      <div class="max-w-xl mx-auto mt-6">
        <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-xs">
          <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="clock" class="w-8 h-8"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-800 mb-1">${TODAY_STR} 上課簽到</h3>
          <p class="text-sm text-slate-500 mb-6">你好，${currentUser.seat}號 ${currentUser.name}！每日 08:30 前完成打卡為「準時出席」。</p>
          
          ${myRec ? `
            <div class="p-4 rounded-xl ${myRec.status === 'present' ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-amber-50 border border-amber-200 text-amber-800'} mb-4">
              <div class="font-bold text-lg mb-1">
                ${myRec.status === 'present' ? '✅ 今日已完成準時打卡' : myRec.status === 'late' ? '⚠️ 今日打卡狀態：遲到' : '📋 今日狀態：請假'}
              </div>
              <div class="text-sm opacity-80">簽到時間：${myRec.time} ${myRec.note ? `（備註：${myRec.note}）` : ''}</div>
            </div>
          ` : `
            <button onclick="studentCheckIn()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-lg cursor-pointer">
              <i data-lucide="fingerprint" class="w-6 h-6"></i>
              立即回傳今日上課打卡
            </button>
          `}
        </div>
      </div>
    `;
  } else {
    let presentCount = 0, lateCount = 0, leaveCount = 0, absentCount = 0;
    appData.students.forEach(s => {
      const r = todayRecords[s.id];
      if (!r || r.status === 'absent') absentCount++;

      else if (r.status === 'late') lateCount++;
      else if (r.status === 'leave') leaveCount++;

    container.innerHTML = `
      <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="bg-white p-5 rounded-xl border border-slate-200">

            <div class="text-2xl font-bold text-slate-800 mt-1">${appData.students.length} 人</div>
          </div>
          <div class="bg-emerald-50/70 p-5 rounded-xl border border-emerald-200">
            <div class="text-xs font-bold text-emerald-600">準時出席</div>
            <div class="text-2xl font-bold text-emerald-700 mt-1">${presentCount} 人</div>

          </div>
          <div class="bg-rose-50/70 p-5 rounded-xl border border-rose-200">
            <div class="text-xs font-bold text-rose-600">尚未打卡 (缺席)</div>
            <div class="text-2xl font-bold text-rose-700 mt-1">${absentCount} 人</div>
          </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
            <span class="font-bold text-slate-700">今日班級點名名冊 (${TODAY_STR})</span>
            <button onclick="exportAttendanceCSV()" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 cursor-pointer">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> 匯出點名 CSV
            </button>
          </div>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-xs text-slate-400 bg-slate-50">
                <th class="py-3 px-4">座號</th>
                <th class="py-3 px-4">學號</th>
                <th class="py-3 px-4">姓名</th>
                <th class="py-3 px-4">打卡時間</th>
                <th class="py-3 px-4">出席狀態 (教師可調整)</th>
                <th class="py-3 px-4">備註</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm">
              ${appData.students.map(s => {
                const rec = todayRecords[s.id] || { status: 'absent', time: '-', note: '' };
                return `
                  <tr class="hover:bg-slate-50/80">
                    <td class="py-3 px-4 font-mono text-slate-500">${s.seat}</td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-400">${s.id}</td>
                    <td class="py-3 px-4 font-bold text-slate-800">${s.name}</td>

                        rec.status === 'present' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                        rec.status === 'late' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                        rec.status === 'leave' ? 'bg-sky-50 text-sky-700 border-sky-200' :
                        'bg-rose-50 text-rose-700 border-rose-200'
                      }">
                        <option value="present" ${rec.status==='present'?'selected':''}>✅ 準時出席</option>
                        <option value="late" ${rec.status==='late'?'selected':''}>⚠️ 遲到</option>
                        <option value="leave" ${rec.status==='leave'?'selected':''}>📋 請假</option>
                        <option value="absent" ${rec.status==='absent'?'selected':''}>❌ 缺席/未打卡</option>
                      </select>
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-500">${rec.note || '-'}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
}

function studentCheckIn() {
  const now = new Date();
  const timeStr = now.toTimeString().slice(0, 5);
  const isLate = now.getHours() > 8 || (now.getHours() === 8 && now.getMinutes() > 30);
  if (!appData.attendance[TODAY_STR]) appData.attendance[TODAY_STR] = {};
  appData.attendance[TODAY_STR][currentUser.id] = {
    status: isLate ? 'late' : 'present',
    time: timeStr,
    note: isLate ? '系統判定超過 08:30' : ''
  };
  saveData();
  renderCurrentTab();
}

function teacherUpdateAttendance(studentId, status) {
  if (!appData.attendance[TODAY_STR]) appData.attendance[TODAY_STR] = {};
  const old = appData.attendance[TODAY_STR][studentId] || { time: new Date().toTimeString().slice(0, 5), note: '' };
  appData.attendance[TODAY_STR][studentId] = {
    status,
    time: status === 'absent' ? '-' : (old.time === '-' ? new Date().toTimeString().slice(0, 5) : old.time),
    note: old.note
  };
  saveData();
  renderCurrentTab();
}

function exportAttendanceCSV() {
  const todayRecords = appData.attendance[TODAY_STR] || {};
  let csv = '\uFEFF座號,學號,姓名,日期,狀態,打卡時間,備註\n';
  appData.students.forEach(s => {
    const r = todayRecords[s.id] || { status: 'absent', time: '-', note: '' };
    const statusMap = { present: '準時出席', late: '遲到', leave: '請假', absent: '缺席' };
    csv += `${s.seat},${s.id},${s.name},${TODAY_STR},${statusMap[r.status]},${r.time},${r.note}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `點名紀錄_${TODAY_STR}.csv`;
  link.click();
}

2,4,公民,鄭老師,教室201

}

function processImportTimetable() {
  const raw = document.getElementById('csvTimetableInput').value.trim();
  if (!raw) return;
  raw.split('\n').forEach(line => {
    const [d, p, subject, teacher, room] = line.split(',').map(s => s?.trim());
    if (d >= 1 && d <= 5 && p >= 1 && p <= 7 && subject) {
      appData.timetable[`${d}-${p}`] = { subject, teacher: teacher || '', room: room || '' };
    }
  });
  saveData();
  closeModal();
  renderCurrentTab();
}

// ==================== 6. 模組三：課程公告發布 ====================
function renderAnnouncements(container) {
  const sorted = [...appData.announcements].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

  container.innerHTML = `
    <div class="max-w-4xl mx-auto space-y-5">
      ${currentUser.role === 'teacher' ? `
        <div class="flex justify-end">
          <button onclick="openNewAnnouncementModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-xs flex items-center gap-2 cursor-pointer">
            <i data-lucide="plus" class="w-4 h-4"></i> 發布新課程公告
          </button>
        </div>
      ` : ''}

      <div class="space-y-4">
        ${sorted.map(ann => {
          const isRead = ann.readBy.includes(currentUser.id);
          return `
            <div class="bg-white rounded-xl border ${ann.pinned ? 'border-indigo-300 ring-2 ring-indigo-50' : 'border-slate-200'} p-6 shadow-xs">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="flex items-center gap-2 mb-2">
                    ${ann.pinned ? `<span class="bg-indigo-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-md">📌 置頂</span>` : ''}
                    <span class="bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-0.5 rounded-md">${ann.category}</span>
                    <span class="text-xs text-slate-400 font-mono">${ann.date}</span>
                  </div>
                  <h3 class="text-lg font-bold text-slate-800">${ann.title}</h3>
                </div>
                ${currentUser.role === 'teacher' ? `
                  <button onclick="deleteAnnouncement('${ann.id}')" class="text-slate-400 hover:text-rose-500 p-1 cursor-pointer" title="刪除公告">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                ` : `
                  <button onclick="markAnnouncementRead('${ann.id}')" class="text-xs font-bold px-3 py-1.5 rounded-lg border transition ${
                    isRead ? 'bg-slate-50 text-slate-400 border-slate-200 cursor-default' : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 cursor-pointer'
                  }">
                    ${isRead ? '✓ 已讀確認' : '點擊標記已讀'}
                  </button>
                `}
              </div>
              <p class="text-sm text-slate-600 mt-3 leading-relaxed whitespace-pre-line">${ann.content}</p>
              <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                <span>發布者：${ann.author || '班導師 陳老師'}</span>
                <span>已讀人數：${ann.readBy.length} / ${appData.students.length} 人</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function openNewAnnouncementModal() {
  showModal(`
    <div class="p-6">
      <h3 class="text-lg font-bold text-slate-800 mb-4">發布課程公告</h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">公告標題</label>
          <input id="annTitle" type="text" placeholder="請輸入標題..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">公告分類</label>
            <select id="annCat" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <option value="重要通知">重要通知</option>
              <option value="考試日程">考試日程</option>
              <option value="班級活動">班級活動</option>
              <option value="課程調整">課程調整</option>
            </select>
          </div>
          <div class="flex items-end pb-2">
            <label class="flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer">
              <input id="annPin" type="checkbox" class="w-4 h-4 text-indigo-600 rounded"> 設為置頂公告
            </label>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">公告內容</label>
          <textarea id="annContent" rows="4" placeholder="請輸入詳細公告事項..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="createAnnouncement()" class="px-4 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700">立即發布</button>
      </div>
    </div>
  `);
}

function createAnnouncement() {
  const title = document.getElementById('annTitle').value.trim();
  const category = document.getElementById('annCat').value;
  const pinned = document.getElementById('annPin').checked;
  const content = document.getElementById('annContent').value.trim();
  if (!title || !content) return alert('請填寫標題與內容');

  appData.announcements.unshift({
    id: 'A' + Date.now(),
    title, category, content, pinned,
    author: currentUser.name,
    date: TODAY_STR,
    readBy: []
  });
  saveData();
  closeModal();
  renderCurrentTab();
}

function markAnnouncementRead(id) {
  const ann = appData.announcements.find(a => a.id === id);
  if (ann && !ann.readBy.includes(currentUser.id)) {
    ann.readBy.push(currentUser.id);
    saveData();
    renderCurrentTab();
  }
}

function deleteAnnouncement(id) {
  appData.announcements = appData.announcements.filter(a => a.id !== id);
  saveData();
  renderCurrentTab();
}

  showModal(`

      </div>

function createHomework() {
  const subject = document.getElementById('hwSubj').value.trim();
  const dueDate = document.getElementById('hwDue').value;
  const title = document.getElementById('hwTitle').value.trim();
  const description = document.getElementById('hwDesc').value.trim();
  if (!subject || !title) return alert('請填寫科目與作業名稱');

  appData.homework.unshift({
    id: 'H' + Date.now(),
    subject, dueDate, title, description,
    submissions: {}
  });
  saveData();
  closeModal();
  renderCurrentTab();
}

function openSubmitHomeworkModal(hwId) {
  const hw = appData.homework.find(h => h.id === hwId);
  const existing = hw.submissions[currentUser.id] || { content: '' };
  showModal(`
    <div class="p-6">
      <h3 class="text-lg font-bold text-slate-800 mb-1">繳交作業：${hw.title}</h3>
      <p class="text-xs text-slate-500 mb-4">${hw.description}</p>
      <textarea id="studentHwInput" rows="5" placeholder="請輸入作業回答內容，或貼上雲端硬碟作業連結..." class="w-full border border-slate-300 rounded-lg p-3 text-sm">${existing.content}</textarea>
      <div class="mt-5 flex justify-end gap-2">
        <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="submitHomework('${hwId}')" class="px-4 py-2 text-sm bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700">確認送出</button>
      </div>
    </div>
  `);
}

function submitHomework(hwId) {
  const content = document.getElementById('studentHwInput').value.trim();
  if (!content) return alert('請輸入作業內容');
  const hw = appData.homework.find(h => h.id === hwId);
  const old = hw.submissions[currentUser.id] || {};
  hw.submissions[currentUser.id] = {
    content,
    time: new Date().toTimeString().slice(0, 5),
    grade: old.grade || '',
    feedback: old.feedback || ''
  };
  saveData();
  closeModal();
  renderCurrentTab();
}

function openGradeHomeworkModal(hwId) {
  const hw = appData.homework.find(h => h.id === hwId);
  showModal(`
    <div class="p-6 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">批改作業：${hw.title}</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-4">
        ${appData.students.map(s => {
          const sub = hw.submissions[s.id];
          return `
            <div class="p-3.5 rounded-xl border ${sub ? 'border-slate-200 bg-white' : 'border-slate-100 bg-slate-50'}">
              <div class="flex justify-between items-center mb-1">
                <span class="font-bold text-sm text-slate-800">${s.seat}號 ${s.name}</span>
                <span class="text-xs ${sub ? 'text-emerald-600 font-bold' : 'text-rose-400'}">${sub ? `已於 ${sub.time} 繳交` : '尚未繳交'}</span>
              </div>
              ${sub ? `
                <p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg my-2">${sub.content}</p>
                <div class="flex gap-2 mt-2">
                  <input id="grade-${hwId}-${s.id}" type="text" value="${sub.grade}" placeholder="分數 (如 95)" class="w-24 border border-slate-300 rounded-md px-2 py-1 text-xs">
                  <input id="fb-${hwId}-${s.id}" type="text" value="${sub.feedback}" placeholder="輸入給學生的評語..." class="flex-1 border border-slate-300 rounded-md px-2 py-1 text-xs">
                  <button onclick="saveGrade('${hwId}', '${s.id}')" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-md hover:bg-indigo-700">儲存</button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `);
  lucide.createIcons();
}

function saveGrade(hwId, studentId) {
  const hw = appData.homework.find(h => h.id === hwId);
  hw.submissions[studentId].grade = document.getElementById(`grade-${hwId}-${studentId}`).value.trim();
  hw.submissions[studentId].feedback = document.getElementById(`fb-${hwId}-${studentId}`).value.trim();
  saveData();
  alert('評分與評語已儲存！');
}

// ==================== 8. 模組五：師生一對一私訊 ====================
function renderMessages(container) {
  if (currentUser.role === 'student') {
    const chatList = appData.messages[currentUser.id] || [];
    chatList.forEach(m => { if (m.sender === 'teacher') m.read = true; });
    saveData();

    container.innerHTML = `
      <div class="max-w-3xl mx-auto h-full flex flex-col bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold">師</div>
            <div>
              <div class="font-bold text-slate-800 text-sm">班導師專屬對話頻道</div>
              <div class="text-xs text-slate-500">一對一私密溝通（僅你與老師可見）</div>
            </div>
          </div>
          <button onclick="insertQuickLeaveMsg()" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg font-medium text-slate-700 cursor-pointer">
            📝 插入請假範本
          </button>
        </div>

        <div id="chatBox" class="flex-1 p-5 overflow-y-auto space-y-3 bg-slate-50/40">
          ${chatList.length === 0 ? `<div class="text-center text-xs text-slate-400 mt-10">尚無對話紀錄，有問題或需要請假可直接傳訊給老師！</div>` : ''}
          ${chatList.map(m => `
            <div class="flex ${m.sender === 'student' ? 'justify-end' : 'justify-start'}">
              <div class="max-w-[75%] rounded-2xl px-4 py-2.5 text-sm ${
                m.sender === 'student' ? 'bg-emerald-600 text-white rounded-br-xs' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-xs'
              }">
                ${m.sender === 'teacher' && m.authorName ? `<div class="text-[10px] font-bold text-indigo-600 mb-0.5">${m.authorName}</div>` : ''}
                <div>${m.text}</div>
                <div class="text-[10px] mt-1 opacity-70 text-right">${m.time}</div>
              </div>
            </div>
          `).join('')}
        </div>

        <form onsubmit="sendPrivateMessage(event, '${currentUser.id}')" class="p-3 border-t border-slate-200 bg-white flex gap-2">
          <input id="msgInput" type="text" placeholder="輸入私訊內容..." class="flex-1 bg-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="send" class="w-4 h-4"></i> 發送
          </button>
        </form>
      </div>
    `;
  } else {
    const activeChat = appData.messages[selectedChatStudentId] || [];
    activeChat.forEach(m => { if (m.sender === 'student') m.read = true; });
    saveData();
    const activeStudent = appData.students.find(s => s.id === selectedChatStudentId) || appData.students[0];

    container.innerHTML = `
      <div class="h-full flex bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="w-64 border-r border-slate-200 flex flex-col bg-slate-50/50">
          <div class="p-4 border-b border-slate-200 font-bold text-xs text-slate-500 uppercase tracking-wider">學生私訊列表</div>
          <div class="flex-1 overflow-y-auto divide-y divide-slate-100">
            ${appData.students.map(s => {
              const msgs = appData.messages[s.id] || [];
              const unread = msgs.filter(m => m.sender === 'student' && !m.read).length;
              const lastMsg = msgs[msgs.length - 1];
              return `
                <button onclick="selectChatStudent('${s.id}')" class="w-full p-3.5 text-left hover:bg-white transition flex items-center justify-between cursor-pointer ${selectedChatStudentId === s.id ? 'bg-white border-l-4 border-indigo-600' : ''}">
                  <div class="overflow-hidden">
                    <div class="font-bold text-sm text-slate-800">${s.seat}號 ${s.name}</div>
                    <div class="text-xs text-slate-400 truncate mt-0.5">${lastMsg ? lastMsg.text : '尚無訊息'}</div>
                  </div>
                  ${unread > 0 ? `<span class="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${unread}</span>` : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <div class="flex-1 flex flex-col">
          <div class="p-4 border-b border-slate-200 bg-white flex items-center justify-between">
            <div class="font-bold text-slate-800">與 ${activeStudent.seat}號 ${activeStudent.name} (${activeStudent.id}) 的一對一對話</div>
            <span class="text-xs text-slate-400">私密對話紀錄</span>
          </div>

          <div id="chatBox" class="flex-1 p-5 overflow-y-auto space-y-3 bg-slate-50/40">
            ${activeChat.length === 0 ? `<div class="text-center text-xs text-slate-400 mt-10">尚無對話紀錄，可主動傳訊關心學生。</div>` : ''}
            ${activeChat.map(m => `
              <div class="flex ${m.sender === 'teacher' ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[75%] rounded-2xl px-4 py-2.5 text-sm ${
                  m.sender === 'teacher' ? 'bg-indigo-600 text-white rounded-br-xs' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-xs'
                }">
                  <div>${m.text}</div>
                  <div class="text-[10px] mt-1 opacity-70 text-right">${m.time}</div>
                </div>
              </div>
            `).join('')}
          </div>

          <form onsubmit="sendPrivateMessage(event, '${activeStudent.id}')" class="p-3 border-t border-slate-200 bg-white flex gap-2">
            <input id="msgInput" type="text" placeholder="回覆 ${activeStudent.name}..." class="flex-1 bg-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-1.5 cursor-pointer">
              <i data-lucide="send" class="w-4 h-4"></i> 回覆
            </button>
          </form>
        </div>
      </div>
    `;
  }
  const box = document.getElementById('chatBox');
  if (box) box.scrollTop = box.scrollHeight;
}

function selectChatStudent(id) {
  selectedChatStudentId = id;
  renderCurrentTab();
}

function insertQuickLeaveMsg() {
  const input = document.getElementById('msgInput');
  input.value = `老師您好，我是 ${currentUser.seat}號 ${currentUser.name}，我今天（${TODAY_STR}）因＿＿＿需要請假一天，再請老師核准，謝謝老師！`;
  input.focus();
}

function sendPrivateMessage(e, studentId) {
  e.preventDefault();
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  if (!appData.messages[studentId]) appData.messages[studentId] = [];
  appData.messages[studentId].push({
    sender: currentUser.role,
    authorName: currentUser.name,
    text,
    time: new Date().toTimeString().slice(0, 5),
    read: false
  });
  saveData();
  renderCurrentTab();
}

function updateUnreadBadge() {
  if (!currentUser) return;
  let count = 0;
  if (currentUser.role === 'teacher') {
    Object.values(appData.messages).forEach(list => {
      count += list.filter(m => m.sender === 'student' && !m.read).length;
    });
  } else {
    const list = appData.messages[currentUser.id] || [];
    count = list.filter(m => m.sender === 'teacher' && !m.read).length;
  }
  const badge = document.getElementById('unreadBadge');
  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

// ==================== 9. 通用 Modal 控制 ====================
function showModal(html) {
  const backdrop = document.getElementById('modalBackdrop');
  document.getElementById('modalContent').innerHTML = html;
  backdrop.classList.remove('hidden');
  backdrop.classList.add('flex');
}

function closeModal() {
  const backdrop = document.getElementById('modalBackdrop');
  backdrop.classList.add('hidden');
  backdrop.classList.remove('flex');
}

init();
</script>
